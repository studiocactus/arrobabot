<!doctype html><html lang="pt-BR"><meta charset="utf-8"><style>html,body{margin:0;background:transparent;color:white;font:700 40px system-ui}.box{display:inline-flex;align-items:center;gap:16px;padding:16px 24px;background:#111720df;border-radius:16px;border:1px solid #ffffff33}.heart{color:#ff7387;font-size:44px}.label{font:13px system-ui;color:#bac5d5;display:block}.bpm{font-variant-numeric:tabular-nums}.hidden{display:none}</style><div class="box hidden" id="box"><span class="heart">♥</span><div><span class="bpm" id="bpm">—</span><span class="label" id="label">BPM · aguardando sinal</span></div></div><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token');history.replaceState(null,'',location.pathname);let last=0,ws;const box=document.querySelector('#box'),bpm=document.querySelector('#bpm'),label=document.querySelector('#label');function draw(v){box.classList.toggle('hidden',v.state==='hidden');if(v.state==='fresh'){bpm.textContent=v.bpm;label.textContent='BPM';last=Date.now()}else{bpm.textContent='—';label.textContent='BPM · sem sinal recente';last=0}}function connect(){if(!token)return;ws=new WebSocket('ws://'+location.host);ws.onopen=()=>ws.send(JSON.stringify({token,mode:'heart-overlay'}));ws.onmessage=e=>{try{const v=JSON.parse(e.data);if(v.type==='heart-rate')draw(v.payload)}catch{}};ws.onclose=()=>{bpm.textContent='—';label.textContent='BPM · desconectado';setTimeout(connect,3000)}}setInterval(()=>{if(last&&Date.now()-last>10000){bpm.textContent='—';label.textContent='BPM · sem sinal recente'}},1000);connect();
</script></html>
